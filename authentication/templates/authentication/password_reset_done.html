{% extends 'authentication/base.html' %}

{% block content %}
    <div class="login-wrapper">
        <div class="login-bg-shape login-bg-shape-1"></div>
        <div class="login-bg-shape login-bg-shape-2"></div>

        <div class="login-card">
            <a href="#" class="login-brand text-decoration-none">
                <i class="bi bi-asterisk"></i>
                <span>LifeOS</span>
            </a>

            <p class="login-subtitle">If an account exists for that email, a reset link is on its way. Check your inbox (and spam folder).</p>

            <p class="login-footer-text mt-3">
                <a href="{% url 'auth-login' %}">Back to Login</a>
            </p>
        </div>
    </div>
{% endblock %}
