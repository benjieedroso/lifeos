{% extends 'authentication/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
    <div class="login-wrapper">
        <div class="login-bg-shape login-bg-shape-1"></div>
        <div class="login-bg-shape login-bg-shape-2"></div>

        <div class="login-card">
            <a href="#" class="login-brand text-decoration-none">
                <i class="bi bi-asterisk"></i>
                <span>LifeOS</span>
            </a>

            <p class="login-subtitle">Create your account to get started.</p>

            <form method="POST" id="loginForm" class="needs-validation" novalidate>
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn-login" id="btn-submit">
                    <span>Create Account</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <p class="login-footer-text mt-3">
                Already have an account? <a href="{% url 'auth-login' %}">Login Now</a>
            </p>
        </div>
    </div>
{% endblock %}
